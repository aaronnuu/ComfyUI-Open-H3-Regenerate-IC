name: Tests
on: [push, pull_request]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: fca60fe70e5b84c5c6b058263653d15cb3401e44
          path: .comfy-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r .comfy-core/requirements.txt -r requirements.txt pytest
      - run: python scripts/download_models.py --assets-only
      - run: python -m pytest tests -q
        env:
          USE_TF: '0'
          COMFYUI_PATH: ${{ github.workspace }}/.comfy-core
          IC_TEST_CPU: '1'
